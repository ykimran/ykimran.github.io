/* Icon theme control */
.theme-toggle{width:44px;height:44px;min-width:44px;min-height:44px;padding:0;display:grid;place-items:center;border:0;border-radius:14px;background:#192b21;color:#edf7e8;flex-shrink:0;transition:background-color .2s,color .2s,transform .15s}.theme-toggle svg{display:block;pointer-events:none}.theme-toggle:hover{background:#284332;color:#fff}.theme-toggle:active{transform:scale(.95)}:root[data-theme="light"] .theme-toggle{background:#edf6e8;color:#263c2b}:root[data-theme="light"] .theme-toggle:hover{background:#dcefd3;color:#263c2b}

.project-title-link{text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:5px}.project-title-link:hover{color:var(--green);text-decoration-color:currentColor}.project-title-link span{font-size:.75em}

/* Portfolio motion */
#site .project,#site .award,#site .entry{transition:transform .25s ease,border-color .25s ease,background-color .3s ease,color .3s ease}
#site .project:focus-within,#site .award:focus-within{transform:translateY(-4px);border-color:var(--green)}
#site .project-art{overflow:hidden}
#site .project-photo{transition:transform 1.1s ease}
#site .link-arrow,#site .project-title-link span{display:inline-block;transition:transform .22s ease}

#site .plate{position:relative;overflow:hidden}
#site .timeline{--timeline-axis:6px;--timeline-inset:26px;position:relative;padding-left:var(--timeline-inset)}
#site .timeline::before,#site .timeline::after{content:"";position:absolute;left:var(--timeline-axis);top:0;bottom:0;width:2px;transform:translateX(-50%);background:var(--line);pointer-events:none}
#site .timeline::after{background:var(--green);transform:translateX(-50%) scaleY(var(--timeline-progress,0));transform-origin:top}
#site .timeline .entry{position:relative}
#site .timeline .entry::before{content:"";position:absolute;box-sizing:border-box;left:calc(var(--timeline-axis) - var(--timeline-inset));top:36.8px;transform:translate(-50%,-50%);width:12px;height:12px;border:2px solid var(--line);background:var(--bg);border-radius:50%;z-index:1;transition:background-color .3s,border-color .3s,box-shadow .3s}
#site .timeline .entry.is-reached::before{background:var(--green);border-color:var(--green);box-shadow:0 0 12px color-mix(in srgb,var(--green) 40%,transparent)}
#site .nav-links{position:relative}
#site .nav-links a[aria-current="location"]{color:var(--green)}
#site .nav-indicator{position:absolute;top:0;left:0;height:2px;background:var(--green);width:var(--nav-width,0px);transform:translate(var(--nav-x,0px),var(--nav-y,0px));opacity:var(--nav-opacity,0);transition:transform .3s ease,width .3s ease,opacity .2s;pointer-events:none}
#site header,#site .award,#site .project-art,#site .button,#site .tag,#site .plate{transition-property:background-color,color,border-color,transform;transition-duration:.3s}
@media(hover:hover){#site .project:hover,#site .award:hover{transform:translateY(-4px);border-color:var(--green)}#site .project:hover .project-photo{transform:scale(1.045)}}
@media(prefers-reduced-motion:reduce){#site *,#site *::before,#site *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}#site .project:hover,#site .award:hover,#site .project:focus-within,#site .award:focus-within,#site .project-photo,#site .link-arrow,#site .project-title-link span{transform:none!important}#site .plate::after{display:none}}


#site .contact-icon{display:inline-block;width:18px;height:18px;flex-shrink:0;vertical-align:-3px;margin-right:8px}

/* Crisp offset highlight inspired by the project-card reference. */
#site .project,#site .award{transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease,background-color .3s ease}
#site .project:focus-within,#site .award:focus-within{box-shadow:12px 12px 0 color-mix(in srgb,var(--green) 22%,transparent)}
@media(hover:hover){#site .project:hover,#site .award:hover{box-shadow:12px 12px 0 color-mix(in srgb,var(--green) 22%,transparent)}}
@media(max-width:760px){#site .project:focus-within,#site .award:focus-within{box-shadow:8px 8px 0 color-mix(in srgb,var(--green) 22%,transparent)}}
@media(max-width:760px) and (hover:hover){#site .project:hover,#site .award:hover{box-shadow:8px 8px 0 color-mix(in srgb,var(--green) 22%,transparent)}}


/* Fill outlined action buttons using the social-button palette. */
#site :is(a,button).button:not(.primary):focus-visible{background:var(--green);border-color:var(--green);color:var(--button-ink)}
@media(hover:hover){#site :is(a,button).button:not(.primary):hover{background:var(--green);border-color:var(--green);color:var(--button-ink)}}


/* Rounded portfolio cards and controls. */
#site .project,#site .award{border-radius:18px}
#site .project-art{border-radius:17px 0 0 17px}
#site .award>.project-photo{border-radius:12px}
#site .button,#site button{border-radius:12px}
#site .tag{border-radius:8px}
#site .plate{border-radius:12px}
@media(max-width:760px){#site .project-art{border-radius:17px 17px 0 0}}


/* Align card actions at the bottom, regardless of description length. */
#site .award{display:flex;flex-direction:column}
#site .award>:is(a,button).button{align-self:flex-start;margin-top:auto}
#site .award>:is(a,button).button:not(:first-child){margin-top:auto}
#site .award:has(>:is(a,button).button){row-gap:8px}


/* Let the contact row gap control spacing consistently when links wrap. */
#site .contact .connect-links{gap:12px;margin-top:20px}
#site .contact .connect-links>.button{margin-top:0}


/* Floating back-to-top control. */
#site .back-to-top{position:fixed;right:max(20px,env(safe-area-inset-right));bottom:max(20px,env(safe-area-inset-bottom));z-index:10;display:grid;place-items:center;width:48px;height:48px;padding:0;border:1px solid var(--green);border-radius:14px;background:var(--green);color:var(--button-ink);box-shadow:0 4px 18px #0002;cursor:pointer;transition:background-color .2s,color .2s,box-shadow .2s}
#site .back-to-top[hidden]{display:none}
#site .back-to-top:hover{box-shadow:0 5px 22px #0003}
#site .back-to-top:focus-visible{outline:2px solid var(--ink);outline-offset:4px}

 #site .project.is-touch-active,#site .award.is-touch-active{transform:translateY(-4px);border-color:var(--green);box-shadow:8px 8px 0 color-mix(in srgb,var(--green) 22%,transparent)}
}

ll be shared here.","meta":"","tags":"","url":"","image":"","metric":""}]},{"id":"projects","label":"Projects","title":"A practical approach.","description":"Coursework and team projects spanning renewable energy, embedded systems, circuit protection, signal processing, and IC design.","layout":"projects","visible":true,"items":[{"title":"DC Microgrid with Net Metering & IoT","text":"Arduino-based educational DC microgrid integrating solar and wind inputs, battery backup, automatic load prioritization, and net metering with a simulated grid. Includes serial telemetry for an ESP8266 IoT dashboard.\n\nWon 2nd Runner-Up in the Inter University Project Showcase Competition at IIUC Tech Fest 2025.","meta":"Nov 2025","tags":"Arduino, DC microgrid, Net metering, Renewable energy, IoT","url":"https://github.com/ykimran/dc-microgrid-with-net-metering-and-iot","image":"","metric":"","linkTitle":true,"showLink":true},{"title":"A Lightweight ANPR System","text":"Developed a Python-based number plate recognition project using classical image processing for plate localization and EasyOCR for English text recognition. Includes image preprocessing, contour-based plate detection, and intermediate-stage visualizations.","meta":"Nov-Dec 2025","tags":"Python, Image processing, EasyOCR, Digital signal processing","url":"https://github.com/ykimran/A-Lightweight-ANPR-System","image":"","metric":""},{"title":"Smart Incubation System","text":"Built an Arduino Uno prototype to monitor temperature and humidity using a DHT11 sensor, control a heating bulb and cooling fan through relays, and display readings on a 16×2 I2C LCD.","meta":"Jun 2025","tags":"Arduino Uno, DHT11, Embedded systems, Proteus","url":"https://github.com/ykimran/Smart-Incubation-System","image":"","metric":"","linkTitle":true,"showLink":true,"linkNewTab":false},{"title":"2 Bit Comparator IC Design","text":"Designed a transistor-level 2-bit binary magnitude comparator in LTspice using static and complex CMOS logic. Compares two 2-bit inputs and produces greater-than, equal-to, and less-than outputs.","meta":"Spring 2026","tags":"LTspice, CMOS, VLSI, Digital logic","url":"https://github.com/ykimran/2bit-comparator-ic-design","image":"","metric":"","linkTitle":true,"showLink":true,"linkNewTab":false},{"title":"Automatic Overcurrent Protection System","text":"Built an Arduino-based AC overcurrent protection prototype using an ACS712 current sensor and a TRIAC switching stage. Estimates RMS current, trips when the filtered current exceeds the threshold, and keeps the trip latched until a manual reset.","meta":"Spring 2026","tags":"Arduino, ACS712, Power electronics, Overcurrent protection","url":"https://github.com/ykimran/Automatic-OCP-System-using-Arduino","image":"","metric":"","showLink":true,"linkTitle":true,"linkNewTab":false},{"title":"AM Communication Simulation","text":"Simulated an AM transmitter, a Gaussian-noise channel, and an envelope-detection receiver in MATLAB. Explores modulation, RC filtering, time-domain waveforms, and frequency spectra using base MATLAB functions.","meta":"","tags":"MATLAB, Communication systems, AM, Signal processing","url":"https://github.com/ykimran/AM-Communication-Simulation","image":"","metric":""}]},{"id":"skills","label":"Skills","title":"Tools I work with.","description":"Software and tools for programming, circuit simulation, electrical design, industrial automation, data analysis, research, and productivity.","layout":"cards","visible":true,"items":[{"title":"Programming & Numerical Computing","text":"","meta":"","tags":"Python, MATLAB","url":"","image":"","metric":""},{"title":"Engineering Simulation & Circuit Design","text":"","meta":"","tags":"MATLAB Simulink, Proteus, LTspice, NI Multisim, PowerWorld Simulator, SCAPS-1D","url":"","image":"","metric":""},{"title":"Electrical Design & Industrial Automation","text":"","meta":"","tags":"AutoCAD, Siemens LOGO! Soft Comfort","url":"","image":"","metric":""},{"title":"Data Analysis & Scientific function sectionHTML(s,i){
 const head=`<div class="section-head"><div><div class="eyebrow">${String(i+1).padStart(2,'0')} / ${esc(s.label)}</div><h2>${esc(s.title)}</h2></div>${paragraphs(s.description)}</div>`;
 const items=s.items.map((a,index)=>{
  const image=safeURL(a.image,true), url=a.showLink===false?'':safeURL(a.url);
  const titleLink=(a.linkTitle??(s.layout==='projects'))&&Boolean(a.title.trim());
  const newTab=a.linkNewTab??!titleLink;
  const target=newTab?' target="_blank" rel="noopener noreferrer"':'';
  const label=a.linkLabel?.trim()||(s.layout==='timeline'?'Learn more':'View project');
  const heading=a.title?`<h3>${url&&titleLink?`<a class="project-title-link" href="${esc(url)}"${target}>${esc(a.title)} <span aria-hidden="true">↗</span></a>`:esc(a.title)}</h3>`:'';
  const action=url&&!titleLink?`<a class="button" href="${esc(url)}"${target}>${esc(label)} <span class="link-arrow" aria-hidden="true">↗</span></a>`:'';
  const details=`${a.metric?`<div class="gpa">${esc(a.metric)}</div>`:''}${heading}${paragraphs(a.text)}${tags(a.tags)}${action}`;
  const body=`${a.meta?`<div class="eyebrow">${esc(a.meta)}</div>`:''}${details}`;
  if(s.layout==='projects')return `<article class="project"><div class="project-art">${image?`<img class="project-photo" src="${esc(image)}" alt="${esc(a.title)}" loading="lazy">`:sharedProjectArt(s,a,index)}</div><div class="project-copy">${body}</div></article>`;
  if(s.layout==='timeline')return `<article class="entry"><div class="date">${esc(a.meta)}</div><div>${details}</div></article>`;
  return `<article class="${s.layout==='cards'?'award':'text-block'}">${image?`<img class="project-photo" src="${esc(image)}" alt="${esc(a.title)}" loading="lazy">`:''}${body}</article>`;
 }).join('');
 return `<section id="${esc(s.id)}"><div class="wrap">${head}<div class="${s.layout==='cards'?'awards':s.layout==='timeline'?'timeline':''}">${items}</div></div></section>`;
}
