<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<title>Choose your dashboard | Imran Yakub</title>
<style>
:root{color-scheme:dark;--bg:#0b1115;--card:#101a1b;--ink:#edf2ed;--muted:#a4b5aa;--line:#27332f;--accent:#bce5aa}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 system-ui,sans-serif;min-height:100svh;display:grid;place-items:center}main{width:min(680px,100%);padding:48px 24px}.eyebrow{font:11px monospace;letter-spacing:2px;color:var(--accent)}h1{font-size:clamp(32px,7vw,48px);line-height:1.12;letter-spacing:-.04em;margin:18px 0}p{color:var(--muted);margin:0 0 28px}.hosts{display:grid;grid-template-columns:1fr 1fr;gap:16px}.host{display:block;padding:24px;background:var(--card);border:1px solid var(--line);border-radius:16px;color:inherit;text-decoration:none;font:inherit;text-align:left;transition:border-color .2s,transform .2s}.host strong{display:flex;align-items:center;gap:12px;font-size:21px;font-weight:600}.host-logo{display:block;flex-shrink:0;width:26px;height:26px}.cloudflare-logo{width:36px}.host span{display:block;color:var(--muted);font-size:14px;margin-top:8px}.host small{display:block;color:var(--accent);margin-top:24px}.host:disabled{opacity:.6;cursor:default}.host:focus-visible,.back:focus-visible{outline:2px solid var(--accent);outline-offset:5px}@media(hover:hover){a.host:hover{border-color:var(--accent);transform:translateY(-3px)}}.back{display:inline-block;color:var(--accent);margin-top:28px;text-underline-offset:4px}#host-status{font-size:13px;margin-top:18px;margin-bottom:0}@media(max-width:480px){.hosts{grid-template-columns:1fr}.host{padding:20px}.host small{margin-top:12px}}@media(prefers-reduced-motion:reduce){.host{transition:none;transform:none!important}}
</style>
</head>
<body><main>
<div class="eyebrow">YK / CONTENT STUDIO</div>
<h1>Choose your dashboard.</h1>
<p>Both dashboards edit the same portfolio. Use whichever is available.</p>
<div class="hosts">
<a class="host" id="vercel-host" href="https://ykimran-portfolio-admin.vercel.app/admin"><strong><svg class="host-logo vercel-logo" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M12 3 24 24H0Z"/></svg>Vercel</strong><span>Sign in with GitHub to edit your portfolio.</span><small>Open dashboard ↗</small></a>
<button class="host" id="cloudflare-pending" disabled><strong><svg class="host-logo cloudflare-logo" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" width="66" height="30" fill="none" viewBox="0 0 66 30"><g clip-path="url(#clip0_746_2)"><path fill="#ff9910" d="M53.12 13.125c6.997 0 12.668 5.708 12.668 12.75 0 1.255-.18 2.468-.516 3.614a.72.72 0 0 1-.694.511H46.953a.375.375 0 0 1-.348-.51l.337-.882c1.076-2.833 4.146-5.154 6.987-5.29l5.384-.277a.543.543 0 0 0 .514-.544.543.543 0 0 0-.51-.544l-5.056-.299c-2.718-.14-4.046-2.56-3.315-5.081l.842-2.902a.72.72 0 0 1 .646-.527q.34-.02.686-.019"/><path fill="#ff5f08" d="M35.609 0c7.295 0 13.424 5.025 15.157 11.824.073.285.05.586-.054.862l-1.388 3.677c-1.076 2.833-3.842 5.29-6.97 5.29l-24.105.278a.533.533 0 0 0-.525.535c0 .293.234.531.524.535l23.765.316c2.724 0 4.046 2.56 3.316 5.081l-.307 1.061a.75.75 0 0 1-.716.541H.964a.71.71 0 0 1-.718-.646 11 11 0 0 1-.034-.854c0-5.476 4.166-9.973 9.482-10.456a7.2 7.2 0 0 1-.167-1.544c0-3.935 3.17-7.125 7.08-7.125 1.555 0 2.994.506 4.162 1.362C22.849 4.497 28.707 0 35.609 0"/><path fill="#ff9910" d="M53.12 13.125c6.997 0 12.668 5.708 12.668 12.75 0 1.255-.18 2.468-.516 3.614a.72.72 0 0 1-.694.511H46.953a.375.375 0 0 1-.348-.51l.337-.882c1.076-2.833 4.146-5.154 6.987-5.29l5.384-.277a.543.543 0 0 0 .514-.544.543.543 0 0 0-.51-.544l-5.056-.299c-2.718-.14-4.046-2.56-3.315-5.081l.842-2.902a.72.72 0 0 1 .646-.527q.34-.02.686-.019"/><path fill="#ff5f08" d="M35.609 0c7.295 0 13.424 5.025 15.157 11.824.073.285.05.586-.054.862l-1.388 3.677c-1.076 2.833-3.842 5.29-6.97 5.29l-24.105.278a.533.533 0 0 0-.525.535c0 .293.234.531.524.535l23.765.316c2.724 0 4.046 2.56 3.316 5.081l-.307 1.061a.75.75 0 0 1-.716.541H.964a.71.71 0 0 1-.718-.646 11 11 0 0 1-.034-.854c0-5.476 4.166-9.973 9.482-10.456a7.2 7.2 0 0 1-.167-1.544c0-3.935 3.17-7.125 7.08-7.125 1.555 0 2.994.506 4.162 1.362C22.849 4.497 28.707 0 35.609 0"/></g><defs><clipPath id="clip0_746_2"><path fill="#fff" d="M0 0h66v30H0z"/></clipPath></defs></svg>Cloudflare</strong><span>Waiting for account setup.</span><small>Not connected yet</small></button>
</div>
<p id="host-status" role="status" aria-live="polite"></p>
<a class="back" href="/">Back to portfolio</a>
</main><script>
(()=>{
const validURL=value=>{try{const u=new URL(value);return u.protocol==='https:'&&!u.username&&!u.password?u.href:null;}catch{return null;}};
fetch('./hosts.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Unavailable');return r.json();}).then(hosts=>{
 const vercel=validURL(hosts.vercel);if(vercel)document.getElementById('vercel-host').href=vercel;
 const cloudflare=validURL(hosts.cloudflare);if(!cloudflare)return;
 const a=document.createElement('a');a.className='host';a.href=cloudflare;
 const strong=document.querySelector('#cloudflare-pending strong').cloneNode(true);
 const span=document.createElement('span');span.textContent='Sign in with GitHub to edit your portfolio.';
 const small=document.createElement('small');small.textContent='Open dashboard ↗';a.append(strong,span,small);
 document.getElementById('cloudflare-pending').replaceWith(a);
}).catch(()=>{document.getElementById('host-status').textContent='Could not load the dashboard list. The Vercel link is still available.';});
})();
</script></body></html>
